services:
  curenova-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: curenova-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - CURENOVA_JWT_SECRET=${CURENOVA_JWT_SECRET}
      - CURENOVA_SECRET_KEY=${CURENOVA_SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/curenova.db}
      - ENABLE_DEMO_SEEDING=false
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://app.curenova.com}
      - NCBI_API_KEY=${NCBI_API_KEY:-}
      - OPENFDA_API_KEY=${OPENFDA_API_KEY:-}
      - LLM_BACKEND_ENABLED=${LLM_BACKEND_ENABLED:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      - LLM_API_KEY=${LLM_API_KEY:-}
    volumes:
      - curenova_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  curenova_data:
    driver: local
